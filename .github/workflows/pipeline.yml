name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  terraform-jobs:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folder: [network, storage_cdn, gke, workload_identity]

    env:
      TF_VAR_project_id: "devops-challenge-493713"
      TF_VAR_region: "southamerica-east1"

      TF_VAR_network_name: "demo-network"
      TF_VAR_network: "demo-network"
      TF_VAR_private_subnet: "demo-network-private"
      TF_VAR_pods_range_name: "gke-pods"
      TF_VAR_services_range_name: "gke-services"

      TF_VAR_bucket_name: "devops-challenge-493713-static"
      TF_VAR_bucket_role: "roles/storage.objectAdmin"

      TF_VAR_gsa_name: "admin-uploader"
      TF_VAR_gsa_display_name: "Service account for admin uploads"
      TF_VAR_k8s_namespace: "default"
      TF_VAR_k8s_service_account: "admin-panel"

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ matrix.folder }}
          framework: terraform
          soft_fail: true

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -no-color
        working-directory: ${{ matrix.folder }}

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.folder }}

      - name: Terraform Plan
        run: terraform plan -input=false -no-color
        working-directory: ${{ matrix.folder }}